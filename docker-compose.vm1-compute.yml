# ─────────────────────────────────────────────────────────────────────────────
# HarbourWatch — VM 1: Compute, Analytics & Application Stack (Portainer Ready)
#
# Storage infrastructure (Kafka + HBase) runs on VM 2.
# Deploy via Portainer on VM 1:
#   1. Go to Portainer on VM 1 -> Stacks -> Add stack.
#   2. Name: harbourwatch-compute
#   3. Paste this YAML into the Web editor.
#   4. Under "Environment variables", add:
#        VM2_PRIVATE_IP = <private IP of VM 2, e.g. 10.0.0.6 or 172.31.20.20>
#        AISSTREAM_API_KEY = <your aisstream.io key (optional, falls back to NOAA demo)>
#   5. Click "Deploy the stack".
# ─────────────────────────────────────────────────────────────────────────────
name: harbourwatch-compute

services:
  # One-shot initialization: waits for VM 2 storage, then provisions schemas & geo data
  init:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        echo "[init] Waiting for remote Kafka and HBase on VM 2 (${STORAGE_HOST})..."

        python - <<'PY'
        import os
        import socket
        import time
        import urllib.request

        bootstrap = os.environ["KAFKA_BOOTSTRAP"]
        host, port = bootstrap.rsplit(":", 1)
        hbase_url = os.environ["HBASE_REST_URL"].rstrip("/") + "/version/cluster"

        def wait_for_kafka():
            print(f"[init] Checking Kafka connection to {bootstrap}...")
            for attempt in range(1, 91):
                try:
                    with socket.create_connection((host, int(port)), timeout=3):
                        print(f"[init] Kafka reachable at {bootstrap}")
                        return
                except OSError as exc:
                    if attempt == 90:
                        raise SystemExit(f"Kafka unavailable at {bootstrap} after 90 attempts: {exc}")
                    time.sleep(3)

        def wait_for_hbase():
            print(f"[init] Checking HBase REST connection to {hbase_url}...")
            for attempt in range(1, 91):
                try:
                    with urllib.request.urlopen(hbase_url, timeout=3) as response:
                        if response.status == 200:
                            print(f"[init] HBase reachable at {hbase_url}")
                            return
                except Exception as exc:
                    if attempt == 90:
                        raise SystemExit(f"HBase unavailable at {hbase_url} after 90 attempts: {exc}")
                    time.sleep(3)

        wait_for_kafka()
        wait_for_hbase()
        PY

        echo "[init] Ensuring Kafka topics exist..."
        python -m common.topics

        echo "[init] Ensuring HBase tables exist..."
        python -m storage.hbase.tables

        echo "[init] Initializing DuckDB warehouse schema..."
        python -c "from common.config import settings; from storage.warehouse.load import connect; con = connect(settings().warehouse_path); con.close(); print('[init] DuckDB schema initialized')"

        echo "[init] Fetching maritime zones..."
        python -m ingest.maritime_zones "$${MONITOR_COUNTRY:-US}" "$${MONITOR_ISO3:-USA}" || echo "[init] Warning: maritime-zone fetch failed, using default boundaries"

        if [ -z "$${AISSTREAM_API_KEY}" ] && [ ! -d "/app/data/noaa/csv" ]; then
          echo "[init] No AIS key or NOAA CSV directory found; attempting NOAA demo download..."
          python -m ingest.noaa --date 2024-01-01 --days 1 --bbox 24.0,-125.0,49.0,-66.0 || echo "[init] Warning: NOAA demo download failed"
        fi

        echo "[init] Initialization completed successfully."

    environment:
      # Remote storage infrastructure on VM 2
      &app-env
      STORAGE_HOST: "${VM2_PRIVATE_IP:-${STORAGE_IP:-127.0.0.1}}"
      KAFKA_BOOTSTRAP: "${VM2_PRIVATE_IP:-${STORAGE_IP:-127.0.0.1}}:9092"
      HBASE_REST_URL: "http://${VM2_PRIVATE_IP:-${STORAGE_IP:-127.0.0.1}}:8080"
      DATA_DIR: /app/data

      # Ingestion
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      LIVE_BBOX: ${LIVE_BBOX:--90.0,-180.0,90.0,180.0}

      # Monitoring scope
      MONITOR_COUNTRY: ${MONITOR_COUNTRY:-US}
      MONITOR_ISO3: ${MONITOR_ISO3:-USA}
      MONITOR_PORTS: ${MONITOR_PORTS:-}
      MONITOR_PARTNERS: ${MONITOR_PARTNERS:-auto}
      MONITOR_WATERS: ${MONITOR_WATERS:-}
      MONITOR_REGION_KM: ${MONITOR_REGION_KM:-150}
      MONITOR_MAX_PARTNERS: ${MONITOR_MAX_PARTNERS:-50}
      MONITOR_MIN_PARTNERS: ${MONITOR_MIN_PARTNERS:-20}
      MONITOR_AIS_PAD: ${MONITOR_AIS_PAD:-4}
      MONITOR_AIS_REGION_KM: ${MONITOR_AIS_REGION_KM:-1500}
      MONITOR_AIS_SOURCE_KM: ${MONITOR_AIS_SOURCE_KM:-1000}
      MONITOR_FOLLOWABLE_HOURS: ${MONITOR_FOLLOWABLE_HOURS:-96}
      MONITOR_SOURCE_PORT_KM: ${MONITOR_SOURCE_PORT_KM:-60}
      MONITOR_STOP_KM: ${MONITOR_STOP_KM:-15}
      MONITOR_LEFT_KM: ${MONITOR_LEFT_KM:-30}
      MONITOR_SLOW_KN: ${MONITOR_SLOW_KN:-1.5}

      # Alert thresholds
      DARK_TIMEOUT_HOURS: ${DARK_TIMEOUT_HOURS:-6}
      MIN_ACTIVE_SHIPS: ${MIN_ACTIVE_SHIPS:-3}
      QUEUE_GROWTH_PCT: ${QUEUE_GROWTH_PCT:-50}
      QUEUE_GROWTH_MIN: ${QUEUE_GROWTH_MIN:-5}

      # Map retention
      MAP_TRANSIT_HOURS: ${MAP_TRANSIT_HOURS:-24}
      MAP_ARRIVED_HOURS: ${MAP_ARRIVED_HOURS:-48}
      MAP_SILENT_HOURS: ${MAP_SILENT_HOURS:-48}
      LIVE_SINCE: ${LIVE_SINCE:-2026-10-10}

      # Data lifecycle
      HISTORY_MAX_MB: ${HISTORY_MAX_MB:-5120}
      COLD_MAX_MB: ${COLD_MAX_MB:-10240}

      # Vessel following and backend caching
      FOLLOW_MAX: ${FOLLOW_MAX:-500}
      FOLLOW_DAYS: ${FOLLOW_DAYS:-30}
      FOLLOW_REFRESH_S: ${FOLLOW_REFRESH_S:-300}
      SHIPS_CACHE_S: ${SHIPS_CACHE_S:-5}
      HISTORY_EVERY_S: ${HISTORY_EVERY_S:-600}
      MONITOR_TIMEZONE: ${MONITOR_TIMEZONE:-}

    volumes: &app-volumes
      - app-data:/app/data
    mem_limit: 512m

  # Spark Structured Streaming
  streaming:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "streaming.job", "--starting-offsets", "latest" ]
    environment:
      <<: *app-env
      SPARK_MASTER: ${STREAM_SPARK_MASTER:-local[2]}
      SPARK_DRIVER_MEMORY: ${STREAM_DRIVER_MEMORY:-2g}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      SPARK_UI: ${STREAM_SPARK_UI:-0}
      STREAM_TRIGGER_S: ${STREAM_TRIGGER_S:-5}
    volumes: *app-volumes
    mem_limit: ${STREAM_MEM_LIMIT:-3g}
    cpus: ${STREAM_CPUS:-2}

  # FastAPI backend — 2 workers prevent event-loop starvation and 502 Bad Gateway
  dashboard:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:8000:8000"
    command: [ "uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--timeout-keep-alive", "65" ]
    environment: *app-env
    volumes: *app-volumes
    networks:
      default:
        aliases:
          - backend
    mem_limit: 1024m
    cpus: 2
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=4)" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  # Nginx frontend — serves Leaflet UI and reverse proxies /api requests to dashboard
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/nithiishsd/the-harbour-frontend:latest}
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-80}:80"
    mem_limit: 128m
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # Parquet history archiver
  history:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "batch.archive_history", "--every" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 512m
    cpus: 1

  # Marine weather ingestion
  weather:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "ingest.weather" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 192m

  # Automatic AIS ingestion
  ingest:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "ingest.auto" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 384m

  # Dedicated AIS stream
  live:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "ingest.aisstream" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 192m

  # Vessel follower
  follow:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "ingest.follow" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 256m

  # NOAA replay: runs continuously at 60x speed for demo testing
  replay:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "ingest.replay", "--speed", "60", "--loop" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 256m

  # Batch analytics: runs once for NIGHTLY_DATE, then exits
  nightly:
    image: ${APP_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-backend:latest}
    restart: "no"
    depends_on:
      init:
        condition: service_completed_successfully
    command: [ "python", "-m", "batch.nightly", "--date", "${NIGHTLY_DATE:-2024-01-01}" ]
    environment: *app-env
    volumes: *app-volumes
    mem_limit: 2g
    cpus: 1

volumes:
  app-data:
