name: build-hbase

# Build and publish the custom HBase standalone image to GHCR.
# This only runs when the infra/hbase/ directory changes, keeping build
# minutes low.  The mutable tag `2.6.7` is intentional here: the image
# content is pinned by the ARG HBASE_VERSION inside the Dockerfile.

on:
  push:
    branches: ["main"]
    paths:
      - "infra/hbase/**"
    tags: ["v*.*.*"]
  workflow_dispatch:   # allow a manual publish (e.g. first-time setup)

concurrency:
  group: build-hbase-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running publish

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-hbase

jobs:
  build-and-push:
    name: Build and publish HBase image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=2.6.7
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push HBase image
        uses: docker/build-push-action@v6
        with:
          context: ./infra/hbase
          file: ./infra/hbase/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
