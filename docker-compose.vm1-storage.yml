# ─────────────────────────────────────────────────────────────────────────────
# HarbourWatch — VM 1: Storage & Messaging Stack (Portainer Ready)
#
# Services: Apache Kafka (KRaft mode) + Apache HBase (standalone REST gateway)
# Deploy via Portainer:
#   1. Go to Portainer on VM 1 -> Stacks -> Add stack.
#   2. Name: harbourwatch-storage
#   3. Paste this YAML into the Web editor.
#   4. Under "Environment variables", add:
#        VM1_PRIVATE_IP = <private IP of VM 1, e.g. 10.0.0.5 or 172.31.20.10>
#   5. Click "Deploy the stack".
# ─────────────────────────────────────────────────────────────────────────────
name: harbourwatch-storage

services:

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    mem_limit: 768m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # INTERNAL is for local commands on VM1.
      # EXTERNAL uses VM1's private IP so VM2 can connect across the VPC.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${VM1_PRIVATE_IP:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L622nShTKiAlbOQuNmqqg
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168   # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports:
      # Exposed on 0.0.0.0 so VM2 compute services connect over private IP
      - "0.0.0.0:9092:9092"
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  hbase:
    image: ${HBASE_IMAGE:-ghcr.io/nithiishsd/the-harbour-backend-hbase:2.6.7}
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      # REST gateway: VM2 reads/writes here over private IP
      - "0.0.0.0:8080:8080"
      # Master web UI for cluster monitoring
      - "0.0.0.0:16010:16010"
    volumes:
      - hbase-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/version/cluster || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 18

volumes:
  kafka-data:
  hbase-data:
